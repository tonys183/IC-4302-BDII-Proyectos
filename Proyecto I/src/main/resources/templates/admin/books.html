<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header(title='Libros')}"></head>
<link rel="stylesheet" th:href="@{/css/Book.css}">
<body class="dark-theme">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="app-container">
    <div class="main-content">
        <div class="dashboard-container">
            <h1>Gestión de Libros</h1>
            <p>Añadir, editar y eliminar libros.</p>

            <div>
                <a href="#" th:href="@{/books/new}" class="btn btn-primary">Añadir Libro</a>
            </div>

            <table class="table">
                <thead>
                <tr>
                    <th>Título</th>
                    <th>Editorial</th>
                    <th>Autor(es)</th>
                    <th>Género(s)</th>
                    <th>Precio</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="book : ${books}">
                    <td th:text="${book.bookName}">Libro de Ejemplo</td>
                    <td th:text="${book.publisher != null ? book.publisher.publisherName : '—'}">Editorial</td>
                    <td>
                        <span th:each="author, iterStat : ${book.authors}" th:text="${author.getFullName()} + (${iterStat.last} ? '' : ', ')"></span>
                    </td>
                    <td>
                        <span th:each="genre, iterStat : ${book.genres}" th:text="${genre.genreName} + (${iterStat.last} ? '' : ', ')"></span>
                    </td>
                    <td><span class="price">₡<span th:text="${#numbers.formatDecimal(book.price, 0, 0)}">0</span></span></td>
                    <td>
                        <a th:href="@{/books/edit/{id}(id=${book.bookId})}" class="btn btn-sm btn-info">Editar</a>
                        <a th:href="@{/books/delete/{id}(id=${book.bookId})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Estás seguro de que quieres eliminar este libro?');">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

<div th:replace="~{fragments :: popup}"></div>

<script th:src="@{/js/popup.js}"></script>
<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const message = [[${message}]];
        const errorMessage = [[${errorMessage}]];

        if (message) {
            showPopup('Éxito', message);
        } else if (errorMessage) {
            showPopup('Error', errorMessage);
        }
    });
</script>

</body>
</html>
