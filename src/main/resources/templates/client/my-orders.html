<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{fragments :: header(title='Mis Órdenes')}"></head>
<link rel="stylesheet" th:href="@{/css/Order.css}">

<body class="dark-theme">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="app-container">
    <div class="main-content">
        <div class="dashboard-container">
            <h1>Mis Órdenes</h1>
            <p>Visualiza el estado de tus pedidos y órdenes realizadas.</p>
            
            <div th:if="${#lists.isEmpty(orders)}" class="no-orders">
                <h4>No tienes órdenes registradas</h4>
                <p>¡Explora nuestro catálogo y crea tu primera orden!</p>
                <a href="/catalog" class="btn btn-primary">Ver Catálogo</a>
            </div>

            <table class="table" th:if="${!#lists.isEmpty(orders)}">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Cliente</th>
                        <th>Fecha</th>
                        <th>Total Items</th>
                        <th>Total</th>
                        <th>Estado</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="order : ${orders}">
                        <td th:text="${order.orderId}">1</td>
                        <td th:text="${order.client.firstName + ' ' + order.client.lastName1}">Cliente</td>
                        <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}">01/01/2024</td>
                        <td th:text="${#lists.size(order.orderDetails)}">0</td>
                        <td th:if="${!#lists.isEmpty(order.orderDetails)}">$<span th:text="${#numbers.formatDecimal(#aggregates.sum(order.orderDetails.![quantity * unitPrice]), 1, 2)}">$0.00</span></td>
                        <td th:if="${#lists.isEmpty(order.orderDetails)}">$0.00</td>
                        <td th:text="${order.status.statusName}">Estado</td>
                        <td>
                            <a th:href="@{/catalog/order-details/{id}(id=${order.orderId})}" class="btn btn-sm btn-details">Ver Detalles</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
