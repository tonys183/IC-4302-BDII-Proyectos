<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header(title='Órdenes de Cliente')}"></head>
<link rel="stylesheet" th:href="@{/css/Order.css}">
<body class="dark-theme">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="app-container">
    <div class="main-content">
        <div class="dashboard-container">
            <h1>Gestión de Órdenes</h1>
            <p>Añadir, editar y eliminar órdenes de cliente.</p>

            <div>
                <a href="#" th:href="@{/orders/new}" class="btn btn-primary">Añadir Orden</a>
            </div>

            <table class="table">
                <thead>
                <tr>
                    <th>ID</th>
                    <th>Cliente</th>
                    <th>Fecha</th>
                    <th>Total Items</th>
                    <th>Total</th>
                    <th>Estado</th>
                    <th>Acciones</th>
                </tr>
                </thead>
                <tbody>
                <tr th:each="order : ${orders}">
                    <td th:text="${order.orderId}">1</td>
                    <td th:text="${order.client?.firstName + ' ' + order.client?.lastName1}">Cliente</td>
                    <td th:text="${#dates.format(order.orderDate, 'dd/MM/yyyy')}">01/01/2024</td>
                    <td th:text="${#lists.size(order.orderDetails)}">0</td>
                    <td th:if="${!#lists.isEmpty(order.orderDetails)}">$<span th:text="${#numbers.formatDecimal(#aggregates.sum(order.orderDetails.![quantity * unitPrice]), 1, 2)}">$0.00</span></td>
                    <td th:if="${#lists.isEmpty(order.orderDetails)}">$0.00</td>
                    <td th:text="${order.status?.statusName}">Estado</td>
                    <td>
                        <a th:href="@{/orders/{id}/details(id=${order.orderId})}" class="btn btn-sm btn-details">Ver Detalles</a>
                        <a th:href="@{/orders/edit/{id}(id=${order.orderId})}" class="btn btn-sm btn-info">Editar</a>
                        <a th:href="@{/orders/delete/{id}(id=${order.orderId})}" class="btn btn-sm btn-danger"
                           onclick="return confirm('¿Estás seguro de que quieres eliminar esta orden?');">Eliminar</a>
                    </td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>

</body>
</html>
