<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header(title=${order.orderId == 0 ? 'Añadir Orden' : 'Editar Orden'})}"></head>
<link rel="stylesheet" th:href="@{/css/Order.css}">
<body class="dark-theme">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="app-container">
    <div class="main-content">
        <div class="dashboard-container">
            <h1 th:text="${order.orderId == 0 ? 'Añadir Nueva Orden' : 'Editar Orden'}">Título del Formulario</h1>
            <p>Agregar los detalles de una orden nueva.</p>

            <div class="form-section">
                <form th:action="@{/orders}" th:object="${order}" method="post" class="order-form">
                    <input type="hidden" th:field="*{orderId}" />

                    <div class="form-row">
                        <div class="form-group">
                            <label for="orderDate">Fecha de la Orden</label>
                            <input type="date" id="orderDate" th:field="*{orderDate}" class="form-control" required>
                        </div>

                        <div class="form-group">
                            <label for="client">Cliente</label>
                            <select id="client" th:field="*{client}" class="form-control" required>
                                <option value="">Seleccione un cliente</option>
                                <option th:each="client : ${clients}"
                                        th:value="${client.clientId}"
                                        th:text="${client.getFullName()}">Cliente</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label for="status">Estado</label>
                            <select id="status" th:field="*{status}" class="form-control" required>
                                <option value="">Seleccione un estado</option>
                                <option th:each="status : ${statuses}"
                                        th:value="${status.statusId}"
                                        th:text="${status.statusName}">Estado</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-actions">
                        <a th:href="@{/orders}" class="btn btn-danger">Cancelar</a>
                        <button type="submit" class="btn btn-primary">Guardar Orden</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>

</body>
</html>
