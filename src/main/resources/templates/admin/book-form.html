<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: header(title=${book.bookId == 0 ? 'Añadir Libro' : 'Editar Libro'})}"></head>
<link rel="stylesheet" th:href="@{/css/Book.css}">
<body class="dark-theme">

<nav th:replace="~{fragments :: navbar}"></nav>

<div class="app-container">
    <div class="main-content">
        <div class="dashboard-container">
            <h1 th:text="${book.bookId == 0 ? 'Añadir Nuevo Libro' : 'Editar Libro'}">Título del Formulario</h1>
            <p>Agregar los detalles de un libro nuevo.</p>

            <form th:action="@{/books}" th:object="${book}" method="post" class="book-form">
                <input type="hidden" th:field="*{bookId}" />

                <div class="form-group">
                    <label for="bookName">Título del Libro</label>
                    <input type="text" id="bookName" th:field="*{bookName}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="isbn">ISBN</label>
                    <input type="text" id="isbn" th:field="*{isbn}" class="form-control" required>
                </div>

                <div class="form-group">
                    <label for="publisher">Editorial</label>
                    <select id="publisher" th:field="*{publisher}" class="form-control" required>
                        <option value="">Selecciona una editorial</option>
                        <option th:each="publisher : ${publishers}"
                                th:value="${publisher.publisherId}"
                                th:text="${publisher.publisherName}">Editorial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="price">Precio (₡)</label>
                    <input type="number" id="price" th:field="*{price}" class="form-control" min="0" step="1" required>
                </div>

                <div class="form-group">
                    <label for="authors">Autor(es)</label>
                    <small style="display:block;margin-bottom:6px;">Mantener Ctrl para quitar o seleccionar múltiples autores.</small>
                    <select id="authors" th:field="*{authors}" class="form-control" multiple size="6">
                        <option th:each="author : ${authors}"
                                th:value="${author.author_id}"
                                th:text="${author.getFullName()}">Autor</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="genres">Género(s)</label>
                    <small style="display:block;margin-bottom:6px;">Mantener Ctrl para quitar o seleccionar múltiples géneros.</small>
                    <select id="genres" th:field="*{genres}" class="form-control" multiple size="6">
                        <option th:each="genre : ${genres}"
                                th:value="${genre.genreId}"
                                th:text="${genre.genreName}">Género</option>
                    </select>
                </div>

                <div class="form-actions">
                    <a th:href="@{/books}" class="btn btn-danger">Cancelar</a>
                    <button type="submit" class="btn btn-primary">Guardar Libro</button>
                </div>
            </form>
        </div>
    </div>
</div>

</body>
</html>
