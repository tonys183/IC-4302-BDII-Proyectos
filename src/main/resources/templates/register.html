<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Librería - Registro</title>
    <link rel="stylesheet" th:href="@{/css/Login.css}">
    <script th:src="@{/js/register.js}"></script>
</head>

<body>

<form class="form-signin" th:action="@{/register}" method="post">
    <h2 class="form-signin-heading">Crear Cuenta</h2>

    <div th:if="${error}" class="alert alert-danger">
        <span th:text="${error}"></span>
    </div>
    <div th:if="${success}" class="alert alert-success">
        <span th:text="${success}"></span>
    </div>

    <div class="form-group">
        <label for="username">Nombre de Usuario</label>
        <input type="text" id="username" name="username" class="form-control" 
               placeholder="Nombre de usuario" required minlength="3" maxlength="50">
    </div>

    <div class="form-group">
        <label for="password">Contraseña</label>
        <input type="password" id="password" name="password" class="form-control" 
               placeholder="Mínimo 6 caracteres" required minlength="6">
    </div>

    <div class="form-group">
        <label for="confirmPassword">Confirmar Contraseña</label>
        <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" 
               placeholder="Repite tu contraseña" required minlength="6">
    </div>

    <div class="form-group">
        <label for="role">Tipo de Cuenta</label>
        <select id="role" name="role" class="form-control">
            <option value="CLIENT" selected>Cliente</option>
            <option value="ADMIN">Administrador</option>
        </select>
    </div>

    <button class="btn btn-lg btn-primary btn-block" type="submit">Crear Cuenta</button>
    
    <div class="text-center mt-3">
        <p class="mb-0">¿Ya tiene una cuenta?
            <a th:href="@{/login}" class="text-decoration-none">Iniciar sesión</a>
        </p>
    </div>
</form>

</body>
</html>
