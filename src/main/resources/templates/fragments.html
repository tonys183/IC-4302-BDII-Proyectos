<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:fragment="header(title)">
    <meta charset="UTF-8">
    <title th:text="'Librería - ' + ${title}">Librería</title>
    <link rel="stylesheet" th:href="@{/css/Style.css}">
</head>

<body class="light-theme">

<nav th:fragment="navbar" class="navbar">
    <div class="navbar-left">
        <a class="navbar-brand" th:href="@{/}">Librería</a>
        <div class="navbar-links">
            <a th:href="@{/books}" class="admin-link" th:style="${isAdmin} ? 'display: inline;' : 'display: none;'">Libros</a>
            <a th:href="@{/orders}" class="admin-link" th:style="${isAdmin} ? 'display: inline;' : 'display: none;'">Órdenes</a>
            <a th:href="@{/admin/reports}" class="admin-link" th:style="${isAdmin} ? 'display: inline;' : 'display: none;'">Reportes</a>
            <a th:href="@{/catalog}" class="client-link" th:style="${isAdmin} ? 'display: none;' : 'display: inline;'">Catálogo</a>
            <a th:href="@{/catalog/create-order}" class="client-link" th:style="${isAdmin} ? 'display: none;' : 'display: inline;'">Crear Orden</a>
            <a th:href="@{/catalog/my-orders}" class="client-link" th:style="${isAdmin} ? 'display: none;' : 'display: inline;'">Mis Órdenes</a>
        </div>
    </div>
    <div class="navbar-logout">
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="logout-button">Cerrar Sesión</button>
        </form>
    </div>
</nav>

<div th:fragment="popup" id="popup" class="popup" style="display: none;">
    <div class="popup-content">
        <span class="close-button" onclick="closePopup()">&times;</span>
        <h2 id="popup-title"></h2>
        <p id="popup-message"></p>
    </div>
</div>

</body>
</html>
